---
layout: default
---
<article class="page">
  <header class="page__header">
    {%- if page.eyebrow -%}
      <p class="eyebrow">{{ page.eyebrow }}</p>
    {%- endif -%}
    <h1 class="page__title">{{ page.title }}</h1>
    <span class="divider-bar" aria-hidden="true"></span>
    {%- if page.lede -%}
      <p class="lede">{{ page.lede }}</p>
    {%- endif -%}
  </header>

  <div class="prose">
    {{ content }}
  </div>
</article>
