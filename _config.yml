title: Chattanooga Collective
tagline: A Chattanooga cottage food collective
description: >-
  Chattanooga Collective is a devoted group of artisan cottage food makers
  in Chattanooga, TN. Independent kitchens, shared website. Handmade
  goods made by your neighbors under Tennessee's Domestic Kitchen rules.
url: https://chattcollective.com
locale: en-US
timezone: America/New_York

# Build
markdown: kramdown
highlighter: rouge
permalink: /:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - docs
  - CLAUDE.md
  - ROADMAP.md
  - README.md
  - "*.gz"
  - "*.tar"

# Plugins (all GitHub Pages compatible)
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Collections
# Members are rendered inline on the homepage, not as standalone pages, so
# the collection has output: false. Liquid can still iterate site.members.
collections:
  members:
    output: false

# SEO / social
author:
  name: Chattanooga Collective
  email: hello@chattcollective.com
twitter:
  card: summary_large_image
social:
  type: Organization
  name: Chattanooga Collective
  links: []
