<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0703; padding: 28px 32px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .btn-primary {
    background: #e8522a; color: #fff; border: none;
    padding: 16px 36px; font-family: 'Inter', sans-serif; font-size: 13px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 2px; cursor: pointer; display: inline-block;
  }
  .btn-primary-hover {
    background: #c43d1a; color: #fff; border: none;
    padding: 16px 36px; font-family: 'Inter', sans-serif; font-size: 13px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 2px; display: inline-block; transform: translateY(-1px);
  }
  .btn-outline {
    background: transparent; color: #c4aa8a;
    border: 1px solid rgba(196,170,138,0.3);
    padding: 16px 36px; font-family: 'Inter', sans-serif; font-size: 13px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 2px; display: inline-block;
  }
  .btn-outline-hover {
    background: transparent; color: #f5ede0;
    border: 1px solid #c4aa8a;
    padding: 16px 36px; font-family: 'Inter', sans-serif; font-size: 13px;
    font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    border-radius: 2px; display: inline-block;
  }
  .col { display: flex; flex-direction: column; gap: 10px; }
  .tag { font-family: 'Inter', sans-serif; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: #987848; font-weight: 600; }
</style>
</head>
<body>
  <div class="col">
    <span class="tag">Primary</span>
    <span class="btn-primary">Order Now</span>
  </div>
  <div class="col">
    <span class="tag">Primary Hover</span>
    <span class="btn-primary-hover">Order Now</span>
  </div>
  <div class="col">
    <span class="tag">Outline</span>
    <span class="btn-outline">Learn More</span>
  </div>
  <div class="col">
    <span class="tag">Outline Hover</span>
    <span class="btn-outline-hover">Learn More</span>
  </div>
</body>
</html>
