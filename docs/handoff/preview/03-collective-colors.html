<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f0e8; font-family: system-ui, sans-serif; padding: 20px; }
  .row { display: flex; gap: 0; margin-bottom: 10px; }
  .swatch { flex: 1; height: 68px; display: flex; flex-direction: column; justify-content: flex-end; padding: 7px 9px; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
  .hex { font-size: 9px; opacity: 0.6; margin-top: 2px; }
  .section-label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #9a7d58; margin-bottom: 6px; font-weight: 700; }
</style>
</head>
<body>
<div class="section-label">Collective — Backgrounds</div>
<div class="row">
  <div class="swatch" style="background:#faf7f2; border:1px solid #ede6d8;">
    <span class="label" style="color:#3d3020">Card</span><span class="hex" style="color:#3d3020">#faf7f2</span>
  </div>
  <div class="swatch" style="background:#f5f0e8;">
    <span class="label" style="color:#3d3020">Base</span><span class="hex" style="color:#3d3020">#f5f0e8</span>
  </div>
  <div class="swatch" style="background:#ede6d8;">
    <span class="label" style="color:#3d3020">Section</span><span class="hex" style="color:#3d3020">#ede6d8</span>
  </div>
  <div class="swatch" style="background:#2a2018;">
    <span class="label" style="color:#f5f0e8">Dark</span><span class="hex" style="color:#f5f0e8">#2a2018</span>
  </div>
</div>
<div class="section-label">Collective — Greens</div>
<div class="row">
  <div class="swatch" style="background:#3a5c3a;">
    <span class="label" style="color:#f5f0e8">Forest</span><span class="hex" style="color:#f5f0e8">#3a5c3a</span>
  </div>
  <div class="swatch" style="background:#5a8a4a;">
    <span class="label" style="color:#f5f0e8">Spring</span><span class="hex" style="color:#f5f0e8">#5a8a4a</span>
  </div>
</div>
<div class="section-label">Collective — Warmth</div>
<div class="row">
  <div class="swatch" style="background:#c4831a;">
    <span class="label" style="color:#fff">Ochre</span><span class="hex" style="color:#fff">#c4831a</span>
  </div>
  <div class="swatch" style="background:#e8a83a;">
    <span class="label" style="color:#fff">Gold</span><span class="hex" style="color:#fff">#e8a83a</span>
  </div>
  <div class="swatch" style="background:#a04520;">
    <span class="label" style="color:#fff">Rust</span><span class="hex" style="color:#fff">#a04520</span>
  </div>
  <div class="swatch" style="background:#c86040;">
    <span class="label" style="color:#fff">Terracotta</span><span class="hex" style="color:#fff">#c86040</span>
  </div>
</div>
</body>
</html>
