<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0703; padding: 28px 32px; }
  .eyebrow { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #e8522a; font-weight: 600; margin-bottom: 14px; }
  .hero-title { font-family: 'Playfair Display', serif; font-size: 64px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; color: #f5ede0; }
  .hero-title span { color: #e8522a; }
  .divider { width: 44px; height: 2px; background: #e8522a; margin: 18px 0; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 36px; font-weight: 900; line-height: 1.1; color: #f5ede0; }
  .italic-sub { font-family: 'Playfair Display', serif; font-size: 20px; font-style: italic; color: #c4aa8a; font-weight: 400; margin-top: 8px; }
  .card-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: #f5ede0; margin-top: 16px; }
</style>
</head>
<body>
  <p class="eyebrow">Craft-batch · Chattanooga, TN · Since 2026</p>
  <h1 class="hero-title">Starving<br><span>Dragon</span></h1>
  <div class="divider"></div>
  <h2 class="section-title">What Is Chili Crisp?</h2>
  <p class="italic-sub">The ancient art of the infused oil, perfected.</p>
  <h3 class="card-title">Sichuan Heritage</h3>
</body>
</html>
